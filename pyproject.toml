[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-keyboard"
description = "A Retico package for interfacing with keyboard input."
dynamic = ["version"]
dependencies = [
    "retico-core>=2.0.0",
]
authors = [
    {name = "Porter Rigby"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "retico",
    "dialogue",
    "real-time",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]

[project.urls]
Repository = "https://github.com/retico-team/retico-keyboard"

[tool.setuptools_scm]
version_file = "retico_keyboard/version.py"
